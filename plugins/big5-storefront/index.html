<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Big 5 Storefront — Merchandising Grid</title>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,"Segoe UI",Roboto,Arial,sans-serif;background:transparent;color:#1A1F36;overflow:hidden}
  :root{ --blue:#343A94; --blue2:#1F2570; --blueInk:#20265E; --red:#E4002B; --amber:#C77700; --ink:#1A1F36; --sub:#8A8F9C; }
  #app{height:100%;width:100%;display:flex;gap:14px;padding:2px}
  #store{flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;padding:2px 4px 6px 2px}
  #grid{display:grid;gap:14px}
  #notif{flex:0 0 300px;max-width:300px;display:flex;flex-direction:column;min-height:0}
  @media(max-width:640px){ #app{flex-direction:column} #notif{flex:0 0 auto;max-width:none} }

  /* product card */
  .card{background:#fff;border:1px solid #E6E8F0;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
        box-shadow:0 1px 2px rgba(20,25,54,.04);transition:transform .1s,box-shadow .1s;cursor:pointer}
  .card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(32,38,94,.14)}
  .tile{position:relative;aspect-ratio:16/11;background:linear-gradient(135deg,#EEF1FB 0%,#DCE3F7 100%);
        display:flex;align-items:center;justify-content:center;border-bottom:1px solid #EDEFF6;overflow:hidden}
  .tile .pimg{width:100%;height:100%;object-fit:cover;display:block}
  .tile.glyph svg{width:56%;height:56%}
  .rate{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.94);border:1px solid #E6E8F0;border-radius:999px;
        padding:3px 8px;font-size:11px;font-weight:700;color:var(--blueInk);display:flex;align-items:center;gap:3px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .rate svg{width:11px;height:11px}
  .band{position:absolute;left:0;bottom:0;width:100%;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:3px 0}
  .band.oos{background:var(--red);color:#fff}
  .band.low{background:#FFF3D6;color:var(--amber);border-top:1px solid #F3E2AE}
  .body{padding:11px 13px 13px}
  .cat{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
  .name{font-size:14px;font-weight:700;color:var(--ink);margin:3px 0 2px;line-height:1.25;min-height:34px}
  .price{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:8px}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-top:1px solid #F1F2F7}
  .row .k{color:var(--sub);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .row .v{font-weight:700;color:var(--ink);font-size:15px}
  .v.oos{color:var(--red)} .v.low{color:var(--amber)}

  /* notifications */
  .ntitle{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 10px}
  .ntitle b{font-size:15px;color:var(--ink)}
  .ntitle .tog{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub)}
  .pill{width:30px;height:17px;border-radius:999px;background:#D8DBE6;position:relative;transition:background .15s;cursor:pointer}
  .pill::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
  .pill.on{background:var(--blue)} .pill.on::after{left:15px}
  #nlist{overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:2px}
  .note{position:relative;border:1px solid #EDEFF4;border-radius:11px;padding:11px 12px 11px 15px;background:#fff;overflow:hidden}
  .note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .note.urgent::before{background:var(--red)} .note.urgent{background:#FEF3F2}
  .note.warn::before{background:var(--amber)} .note.warn{background:#FFFaf0}
  .note.info::before{background:var(--blue)} .note.info{background:#F2F5FE}
  .nhead{display:flex;align-items:flex-start;gap:8px}
  .nicon{flex:0 0 auto;margin-top:1px} .nicon svg{width:16px;height:16px;display:block}
  .nmeta{flex:1;min-width:0}
  .nkind{font-size:13px;font-weight:800;color:var(--ink)}
  .nbody{font-size:12px;color:#4A4F63;margin-top:2px;line-height:1.3}
  .nx{flex:0 0 auto;color:#B9BDC9;font-size:15px;line-height:1;cursor:pointer;padding:0 2px}
  .nx:hover{color:var(--ink)}
  .nfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .nago{font-size:11px;color:var(--sub)}
  .ndet{font-size:11px;font-weight:600;color:#5A5F72;background:#fff;border:1px solid #E1E3EC;border-radius:7px;padding:3px 10px;cursor:pointer}
  .ndet:hover{border-color:var(--blue);color:var(--blue)}
  .empty{color:var(--sub);font-size:12px;text-align:center;padding:30px 10px}
  ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#D8DBE6;border-radius:8px}

  /* ---- product modal ---- */
  #ov{position:fixed;inset:0;background:rgba(20,25,54,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px;opacity:0;pointer-events:none;transition:opacity .14s}
  #ov.show{opacity:1;pointer-events:auto}
  .modal{background:#fff;border-radius:18px;width:min(860px,96vw);max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(20,25,54,.4);position:relative}
  .mx{position:absolute;top:12px;right:14px;z-index:2;width:30px;height:30px;border:none;border-radius:50%;background:rgba(255,255,255,.9);color:#333;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .mx:hover{background:#fff;color:var(--red)}
  .mgrid{display:grid;grid-template-columns:1.05fr 1fr;min-height:0}
  @media(max-width:680px){ .mgrid{grid-template-columns:1fr} }
  .mimg{position:relative;background:linear-gradient(135deg,#EEF1FB,#DCE3F7);min-height:230px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .mimg img{width:100%;height:100%;object-fit:cover}
  .mimg .mband{position:absolute;left:0;bottom:0;width:100%;text-align:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 0}
  .mimg .mband.oos{background:var(--red);color:#fff} .mimg .mband.low{background:#FFF3D6;color:var(--amber)}
  .mdet{padding:22px 24px 20px}
  .mdet .cat{font-size:11px}
  .mdet h2{font-size:21px;font-weight:800;color:var(--ink);margin:4px 0 6px;line-height:1.2}
  .mdet .mprice{font-size:18px;font-weight:800;color:var(--blue);margin-bottom:12px}
  .mstats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .stat{flex:1;min-width:74px;background:#F5F6FB;border:1px solid #EAECF4;border-radius:10px;padding:8px 10px;text-align:center}
  .stat .sk{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sub)}
  .stat .sv{font-size:17px;font-weight:800;color:var(--ink);margin-top:2px}
  .stat .sv.oos{color:var(--red)} .stat .sv.low{color:var(--amber)}
  .ai{border:1px solid #DfE3F5;background:#F5F7FE;border-radius:12px;padding:13px 14px}
  .aihd{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--blueInk);margin-bottom:9px}
  .aihd svg{width:16px;height:16px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:11px;font-weight:600;color:var(--blueInk);background:#fff;border:1px solid #CDD4F0;border-radius:999px;padding:5px 11px;cursor:pointer;transition:all .1s}
  .chip:hover{border-color:var(--blue);background:#EEF1FB}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .ans{font-size:13px;line-height:1.5;color:#2A3049;min-height:52px;white-space:pre-wrap}
  .ans .cursor{display:inline-block;width:7px;height:14px;background:var(--blue);margin-left:1px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .askform{display:flex;gap:7px;margin-top:11px}
  .askform input{flex:1;font-size:12.5px;padding:8px 11px;border:1px solid #CDD4F0;border-radius:9px;outline:none;background:#fff}
  .askform input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(52,58,148,.12)}
  .askform button{font-size:12.5px;font-weight:700;color:#fff;background:var(--blue);border:none;border-radius:9px;padding:8px 14px;cursor:pointer}
  .askform button:hover{background:var(--blue2)}
</style>
</head>
<body>
<div id="app">
  <div id="store"><div id="grid"></div></div>
  <div id="notif">
    <div class="ntitle"><b>Notifications</b><div class="tog"><span>Urgent only</span><div class="pill" id="tog"></div></div></div>
    <div id="nlist"></div>
  </div>
</div>
<div id="ov"><div class="modal" id="modal"></div></div>
<script>
(function(){
  var client=(window.sigmaComputing&&window.sigmaComputing.plugin&&window.sigmaComputing.plugin.client)||null;
  var CBLUE='#343A94';

  // SVG glyph fallback (used only if a product photo fails to load)
  var G=(function(){
    function w(i){return '<svg viewBox="0 0 64 64" fill="none" stroke="'+CBLUE+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">'+i+'</svg>';}
    return {
      shoe:w('<path d="M6 40h30l14 4c6 2 8 4 8 8H10a4 4 0 0 1-4-4z"/><path d="M12 40V26c0-3 4-4 6-2l8 8"/><path d="M8 52h50"/>'),
      boot:w('<path d="M18 8h10l2 26 18 8c5 2 8 5 8 10H16a6 6 0 0 1-6-6V16a8 8 0 0 1 8-8z"/><path d="M12 56h50"/>'),
      basketball:w('<circle cx="32" cy="32" r="24"/><path d="M32 8v48M8 32h48"/><path d="M15 15c10 8 10 26 0 34M49 15c-10 8-10 26 0 34"/>'),
      dumbbell:w('<path d="M6 24v16M14 20v24M50 20v24M58 24v16"/><path d="M14 32h36"/>'),
      tent:w('<path d="M32 12L8 50h48z"/><path d="M32 12v38M32 50l-8-16M32 50l8-16"/><path d="M4 50h56"/>'),
      bike:w('<circle cx="16" cy="42" r="11"/><circle cx="48" cy="42" r="11"/><path d="M16 42l10-20h14M22 42l14-18M40 22l8 20"/>')
    };
  })();
  function glyphFor(k){ return G[k] || G.basketball; }

  var defs=[
    {name:'source',type:'element'},
    {name:'product',type:'column',source:'source',allowedTypes:['text'],label:'Product name'},
    {name:'category',type:'column',source:'source',allowedTypes:['text'],label:'Category'},
    {name:'glyph',type:'column',source:'source',allowedTypes:['text'],label:'Image key'},
    {name:'price',type:'column',source:'source',allowedTypes:['number','integer'],label:'Price'},
    {name:'sold',type:'column',source:'source',allowedTypes:['number','integer'],label:'Units sold'},
    {name:'available',type:'column',source:'source',allowedTypes:['number','integer'],label:'Units available'},
    {name:'rating',type:'column',source:'source',allowedTypes:['number','integer'],label:'Rating (0-5)'},
    {name:'reorder',type:'column',source:'source',allowedTypes:['number','integer'],label:'Reorder point (optional)'},
    {name:'ai',type:'column',source:'source',allowedTypes:['text'],label:'AI insight (optional)'}
  ];
  if(client) client.config.configureEditorPanel(defs);

  var STAR='<svg viewBox="0 0 24 24" fill="#F5A623" stroke="#F5A623" stroke-width="1"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>';
  var IC_ALERT='<svg viewBox="0 0 24 24" fill="none" stroke="#E4002B" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>';
  var IC_WARN='<svg viewBox="0 0 24 24" fill="none" stroke="#C77700" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>';
  var IC_INFO='<svg viewBox="0 0 24 24" fill="none" stroke="#343A94" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
  var IC_AI='<svg viewBox="0 0 24 24" fill="#343A94" stroke="#343A94" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/><circle cx="18.5" cy="17.5" r="2.2"/></svg>';

  function money(v){ v=Number(v)||0; return '$'+v.toFixed(2); }
  function num(v){ v=Math.round(Number(v)||0); return v.toLocaleString(); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function status(r){ var re=(r.reorder!=null?r.reorder:8); if(r.available<=0)return 'oos'; if(r.available<=re)return 'low'; return 'ok'; }

  function imgTile(r,cls){
    // real product photo with SVG-glyph fallback
    return '<img class="pimg" alt="'+esc(r.product)+'" loading="lazy" src="img/'+encodeURIComponent(r.glyph||'')+'.jpg" '+
      'onerror="this.parentNode.classList.add(\'glyph\');this.outerHTML=window.__b5glyph(this.getAttribute(\'data-k\'));" data-k="'+esc(r.glyph||'')+'">';
  }
  window.__b5glyph=glyphFor;

  var LAST=[];
  function renderCards(rows){
    var grid=document.getElementById('grid');
    var w=document.getElementById('store').clientWidth||900;
    var min=210, cols=Math.max(1,Math.min(4,Math.floor((w+14)/(min+14))));
    grid.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
    grid.innerHTML='';
    if(!rows.length){ grid.innerHTML='<div class="empty">No products match the current filters.</div>'; return; }
    rows.forEach(function(r,idx){
      var st=status(r);
      var band = st==='oos'?'<div class="band oos">Out of stock</div>' : (st==='low'?'<div class="band low">Low stock</div>':'');
      var card=document.createElement('div'); card.className='card';
      card.innerHTML=
        '<div class="tile">'+imgTile(r)+'<div class="rate">'+STAR+(Number(r.rating)||0).toFixed(1)+'</div>'+band+'</div>'+
        '<div class="body">'+
          '<div class="cat">'+esc(r.category)+'</div>'+
          '<div class="name">'+esc(r.product)+'</div>'+
          '<div class="price">'+money(r.price)+'</div>'+
          '<div class="row"><span class="k">Sold</span><span class="v">'+num(r.sold)+'</span></div>'+
          '<div class="row"><span class="k">Available</span><span class="v'+(st==='oos'?' oos':(st==='low'?' low':''))+'">'+num(r.available)+'</span></div>'+
        '</div>';
      card.addEventListener('click',function(){ openModal(r); });
      grid.appendChild(card);
    });
  }

  function buildNotes(rows){
    var notes=[];
    rows.forEach(function(r){
      var st=status(r);
      if(st==='oos') notes.push({sev:0,cls:'urgent',ic:IC_ALERT,kind:'Stockout Alert',body:'Out of stock: '+r.product,ago:'10h ago'});
      else if(st==='low') notes.push({sev:1,cls:'warn',ic:IC_WARN,kind:'Low Stock Alert',body:'Stock below reorder point: '+r.product,ago:'8h ago'});
    });
    notes.push({sev:2,cls:'info',ic:IC_INFO,kind:'Delivery Arrived',body:'Restock delivery DEL-047238 has arrived',ago:'10h ago'});
    notes.sort(function(a,b){return a.sev-b.sev;});
    return notes;
  }
  var urgentOnly=false;
  document.getElementById('tog').addEventListener('click',function(){ urgentOnly=!urgentOnly; this.classList.toggle('on',urgentOnly); renderNotes(LAST); });
  function renderNotes(rows){
    LAST=rows; var notes=buildNotes(rows);
    if(urgentOnly) notes=notes.filter(function(n){return n.sev===0;});
    var list=document.getElementById('nlist'); list.innerHTML='';
    if(!notes.length){ list.innerHTML='<div class="empty">All clear — no alerts.</div>'; return; }
    notes.forEach(function(n){
      var el=document.createElement('div'); el.className='note '+n.cls;
      el.innerHTML='<div class="nhead"><span class="nicon">'+n.ic+'</span><div class="nmeta"><div class="nkind">'+esc(n.kind)+'</div><div class="nbody">'+esc(n.body)+'</div></div><span class="nx">&times;</span></div>'+
        '<div class="nfoot"><span class="nago">'+n.ago+'</span><span class="ndet">Details</span></div>';
      el.querySelector('.nx').addEventListener('click',function(){ el.style.display='none'; });
      list.appendChild(el);
    });
  }

  // ---------- AI insight parsing ----------
  // AI column format from Sigma CallText: "OVERVIEW: .. ||| BESTFOR: .. ||| FEATURES: .. ||| SELLING: .."
  function parseAI(txt,r){
    var out={overview:'',bestfor:'',features:'',selling:''};
    if(txt){
      var parts=String(txt).split('|||');
      parts.forEach(function(p){
        var m=p.match(/^\s*([A-Za-z]+)\s*:\s*([\s\S]*)$/);
        if(m){ var k=m[1].toLowerCase(); if(k in out) out[k]=m[2].trim(); }
      });
      if(!out.overview){ out.overview=String(txt).trim(); }
    }
    if(!out.overview){
      out.overview='The '+r.product+' is one of our '+r.category+' picks — rated '+(Number(r.rating)||0).toFixed(1)+'/5 at '+money(r.price)+'. '+
        num(r.sold)+' sold recently with '+num(r.available)+' on hand.';
    }
    return out;
  }
  var QMAP=[
    {key:'overview',label:'Overview',match:function(){return true;}},
    {key:'bestfor', label:'Who it’s best for',match:function(q){return /who|beginner|kid|child|for me|suitable|good for/.test(q);}},
    {key:'features',label:'Key features',match:function(q){return /feature|spec|material|made|waterproof|weight|size|durab/.test(q);}},
    {key:'selling', label:'How it’s selling',match:function(q){return /sell|selling|popular|stock|inventory|restock|available|demand/.test(q);}}
  ];
  function typeInto(el,text){
    el.textContent=''; var i=0; var cur=document.createElement('span'); cur.className='cursor'; el.appendChild(cur);
    clearInterval(el._t);
    el._t=setInterval(function(){
      if(i>=text.length){ clearInterval(el._t); cur.remove(); return; }
      var span=document.createTextNode(text.slice(i,i+2)); el.insertBefore(span,cur); i+=2;
    },12);
  }

  function openModal(r){
    var ai=parseAI(r.ai,r), st=status(r);
    var band= st==='oos'?'<div class="mband oos">Out of stock</div>':(st==='low'?'<div class="mband low">Low stock — below reorder point</div>':'');
    var modal=document.getElementById('modal');
    modal.innerHTML=
      '<button class="mx" title="Close">&times;</button>'+
      '<div class="mgrid">'+
        '<div class="mimg">'+imgTile(r)+band+'</div>'+
        '<div class="mdet">'+
          '<div class="cat">'+esc(r.category)+'</div>'+
          '<h2>'+esc(r.product)+'</h2>'+
          '<div class="mprice">'+money(r.price)+'</div>'+
          '<div class="mstats">'+
            '<div class="stat"><div class="sk">Rating</div><div class="sv">'+(Number(r.rating)||0).toFixed(1)+' ★</div></div>'+
            '<div class="stat"><div class="sk">Sold</div><div class="sv">'+num(r.sold)+'</div></div>'+
            '<div class="stat"><div class="sk">Available</div><div class="sv '+(st==='oos'?'oos':(st==='low'?'low':''))+'">'+num(r.available)+'</div></div>'+
          '</div>'+
          '<div class="ai">'+
            '<div class="aihd">'+IC_AI+'Ask Big 5 AI about this product</div>'+
            '<div class="chips"></div>'+
            '<div class="ans"></div>'+
            '<form class="askform"><input type="text" placeholder="Ask anything about this product…"><button type="submit">Ask</button></form>'+
          '</div>'+
        '</div>'+
      '</div>';
    var chips=modal.querySelector('.chips'), ans=modal.querySelector('.ans');
    function answer(key,label){
      Array.prototype.forEach.call(chips.children,function(c){ c.classList.toggle('on', c.dataset.k===key); });
      typeInto(ans, ai[key] || ai.overview);
    }
    QMAP.forEach(function(q,i){
      var c=document.createElement('span'); c.className='chip'+(i===0?' on':''); c.textContent=q.label; c.dataset.k=q.key;
      c.addEventListener('click',function(){ answer(q.key,q.label); });
      chips.appendChild(c);
    });
    typeInto(ans, ai.overview);
    modal.querySelector('.mx').addEventListener('click',closeModal);
    modal.querySelector('.askform').addEventListener('submit',function(e){
      e.preventDefault(); var q=(this.querySelector('input').value||'').toLowerCase();
      var hit=QMAP.slice().reverse().find(function(m){return m.match(q);}) || QMAP[0];
      answer(hit.key,hit.label);
    });
    document.getElementById('ov').classList.add('show');
  }
  function closeModal(){ document.getElementById('ov').classList.remove('show'); }
  document.getElementById('ov').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });

  function render(rows){ renderCards(rows); renderNotes(rows); }

  function synth(){
    var C=[
      ['Trail Runner GTX Shoe','Footwear','shoe',89.99,142,27,4.5,10],
      ['Summit Hiking Boot','Footwear','boot',119.99,98,14,4.7,10],
      ['Court Hi Basketball Shoe','Footwear','bball_shoe',74.99,120,0,4.4,10],
      ['Wave Sport Sandal','Footwear','sandal',34.99,210,52,4.2,12],
      ['Turf Baseball Cleat','Footwear','cleat',59.99,64,6,4.3,10],
      ['Pro Grip Basketball','Team Sports','basketball',29.99,180,33,4.6,12],
      ['All-Weather Football','Team Sports','football',24.99,150,0,4.4,12],
